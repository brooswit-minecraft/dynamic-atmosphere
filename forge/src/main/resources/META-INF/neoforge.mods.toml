modLoader="javafml" #mandatory
loaderVersion="[4,)" #mandatory

license="MIT"

[[mods]] #mandatory
modId="dynamicatmosphere" #mandatory
version="${mod_version}" #mandatory
displayName="Dynamic Atmosphere" #mandatory
authors="brooswit"
description='''A persistent, chunk-owned 4-block fog grid with fullness-based spreading and no natural decay or global cell-count cap. Biome-driven evaporation removes real water; condensation places flowing water. All fog uses Minecraft's current fog color. Unknown unloaded boundaries and exhausted budgets defer work, never authorize pressure destruction. Default-enabled destructive pressure breaks eligible blocks with drops and adds 1 material per block. Intrinsically unbreakable blocks are exempt; no claim protection support. Back up worlds: atmospheric amounts, water changes, and terrain damage persist. No world reset or migration is required.'''

[[mixins]]
    config="dynamicatmosphere.mixins.json"

[[dependencies.dynamicatmosphere]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.dynamicatmosphere]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1]"
    ordering="NONE"
    side="BOTH"
