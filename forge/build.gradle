// This subproject is the NeoForge-facing half of the split described in
// the repo README: everything Minecraft/NeoForge-specific lives here. It
// depends on the Minecraft-free :engine subproject and packages that
// subproject's compiled classes directly into this mod's jar (see the
// `jar` task override below) so NeoForge's classloader can reach them at
// runtime — a plain `implementation project(':engine')` alone would NOT do
// that; it only puts :engine on this project's own compile/runtime
// classpath, not inside the artifact NeoForge loads.
plugins {
    id "net.neoforged.moddev" version "2.0.146"
}

group = "io.github.brooswitminecraft"

// Single source of truth for the shipped version (SICKOS-40 deliverable 4):
// the release workflow overrides this with `-Pmod_version=<tag with the
// leading v stripped>`; every other push/PR build (including this one, and
// ci.yml's `./gradlew build`) falls back to the literal default below, which
// must always build cleanly on its own.
def versionFile = rootProject.file("version.txt")
def fallbackVersion = versionFile.exists() ? versionFile.text.trim() : "0.1.0-alpha.1"
def modVersion = (findProperty("mod_version") ?: fallbackVersion) as String
version = modVersion

base {
    archivesName = "dynamicatmosphere"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    // Matches the sickos pack's pinned NeoForge version for Minecraft
    // 1.21.1 (brooswit-minecraft/sickos pack.toml, [versions].neoforge).
    version = "21.1.250"

    mods {
        dynamicatmosphere {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        url = "https://maven.createmod.net"
        content {
            includeGroup "com.simibubi.create"
            includeGroup "net.createmod.ponder"
        }
    }
}

dependencies {
    implementation project(":engine")
    // Only the isolated fan adapter links Create; never bundle it or require it at runtime.
    compileOnly("com.simibubi.create:create-1.21.1:6.0.10-217:slim") { transitive = false }
    compileOnly("net.createmod.ponder:ponder-neoforge:1.0.81+mc1.21.1") { transitive = false }
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

// NeoForge's generated Minecraft artifact belongs to main, not the default
// Java test configurations. SavedData and payload tests need that same API.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

// Embeds :engine's compiled classes directly into this mod's jar, at the
// jar's root (not nested), so they are on the classpath NeoForge loads the
// mod from. This is the "include the engine subproject's output in the mod
// jar directly" option named in SICKOS-36 item 2, chosen over jarJar
// because :engine is our own first-party code with no independent version
// of its own to track — jarJar's nested-jar/versioning machinery exists for
// embedding third-party dependencies, which this isn't.
tasks.named("jar", Jar) {
    from(project(":engine").sourceSets.main.output)
    reproducibleFileOrder = true
    preserveFileTimestamps = false
}

// Expands `${mod_version}` in neoforge.mods.toml's `version=` line to the
// same modVersion computed above, so the jar's file name and the version
// baked into the built jar's mods.toml can never drift apart (SICKOS-40
// deliverable 4). Scoped to just that one file: nothing else under
// resources uses `${}` syntax, and this must not touch pack.mcmeta.
tasks.named("processResources", ProcessResources) {
    def replaceProperties = [mod_version: modVersion]
    inputs.properties replaceProperties
    filesMatching("META-INF/neoforge.mods.toml") {
        expand replaceProperties
    }
}
